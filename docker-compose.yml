# Local stack: builds images from source.
#   cp .env.example .env   # then fill in secrets
#   docker compose up -d --build

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-longrak}
      POSTGRES_USER: ${DATABASE_USERNAME:-longrak}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: longrak-server:local
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_CLIENT: postgres
      KB_EMBEDDING_DIMENSIONS: ${KB_EMBEDDING_DIMENSIONS:-}
      LONGRAK_N8N_EVENT_WEBHOOK_URL: ${LONGRAK_N8N_EVENT_WEBHOOK_URL:-}
      LONGRAK_N8N_EVENT_WEBHOOK_SECRET: ${LONGRAK_N8N_EVENT_WEBHOOK_SECRET:-}
      LONGRAK_N8N_EVENT_WEBHOOK_SECRET_HEADER: ${LONGRAK_N8N_EVENT_WEBHOOK_SECRET_HEADER:-X-LongRak-Secret}
      LONGRAK_INTERNAL_SERVICE_TOKEN: ${LONGRAK_INTERNAL_SERVICE_TOKEN:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      LONGRAK_AI_SERVICE_TOKEN: ${LONGRAK_AI_SERVICE_TOKEN:-}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
    volumes:
      - uploads:/repo/server/public/uploads
    ports:
      - "${SERVER_PORT:-1337}:1337"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: longrak-web:local
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_API_BASE: ${PUBLIC_API_URL:-http://localhost:1337}
      NUXT_N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
      NUXT_N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-}
      NUXT_N8N_PROJECT_WEBHOOK_URL: ${N8N_PROJECT_WEBHOOK_URL:-}
      NUXT_STRAPI_URL: http://server:1337
      NUXT_STRAPI_TOKEN: ${STRAPI_WEBSITE_TOKEN:-}
      NUXT_IP_HASH_SALT: ${IP_HASH_SALT:-}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - server

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    image: longrak-app:local
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_API_BASE: ${PUBLIC_API_URL:-http://localhost:1337}
    ports:
      - "${APP_PORT:-3001}:3000"
    depends_on:
      - server

volumes:
  pgdata:
  uploads:
